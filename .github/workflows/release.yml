name: Build and publish release

on:
  push:
    tags:
      - "v*"

permissions:
  contents: read

jobs:
  test:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: 10.0.x
      - run: dotnet test HibbikiUpdater.sln --configuration Release

  release:
    needs: test
    runs-on: windows-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: 10.0.x
      - name: Publish self-contained Windows app
        run: dotnet publish src/HibbikiUpdater/HibbikiUpdater.csproj --configuration Release --runtime win-x64 --self-contained true -p:PublishSingleFile=true -p:IncludeNativeLibrariesForSelfExtract=true --output publish
      - name: Package release
        shell: pwsh
        run: Compress-Archive -Path publish\* -DestinationPath HibbikiUpdater-${{ github.ref_name }}-win-x64.zip
      - name: Create GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          name: HibbikiUpdater ${{ github.ref_name }}
          generate_release_notes: true
          files: HibbikiUpdater-${{ github.ref_name }}-win-x64.zip
