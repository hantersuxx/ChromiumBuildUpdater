name: CI and release

on:
  push:
    branches:
      - main
    tags:
      - "v*"
  pull_request:
    branches:
      - main
  workflow_dispatch:
    inputs:
      release_tag:
        description: Release tag to build and publish (for example, v3.2.0)
        required: true
        type: string

permissions:
  contents: read

jobs:
  test:
    name: Tests (${{ matrix.os }})
    strategy:
      fail-fast: false
      matrix:
        os: [windows-latest, ubuntu-24.04, macos-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v7
        with:
          ref: ${{ github.event.pull_request.head.sha || inputs.release_tag || github.sha }}
      - uses: actions/setup-dotnet@v6
        with:
          dotnet-version: 10.0.x
      - run: dotnet test ChromiumBuildUpdater.sln --configuration Release
      - run: dotnet build src/ChromiumBuildUpdater/ChromiumBuildUpdater.csproj --configuration Release

  release_please:
    name: Prepare release
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    needs: test
    runs-on: ubuntu-24.04
    permissions:
      contents: write
      issues: write
      pull-requests: write
    outputs:
      release_created: ${{ steps.release.outputs.release_created }}
      tag_name: ${{ steps.release.outputs.tag_name }}
    steps:
      - id: release
        uses: googleapis/release-please-action@v4
      - name: Explain when no release is published
        if: steps.release.outputs.release_created != 'true'
        run: echo "No release was created by this commit; the publisher is skipped." >> "$GITHUB_STEP_SUMMARY"

  publish:
    name: Publish ${{ matrix.rid }}
    if: >-
      always() &&
      needs.test.result == 'success' &&
      (
        startsWith(github.ref, 'refs/tags/v') ||
        (github.event_name == 'workflow_dispatch' && inputs.release_tag != '') ||
        (needs.release_please.result == 'success' && needs.release_please.outputs.release_created == 'true')
      )
    needs:
      - test
      - release_please
    permissions:
      contents: write
    env:
      RELEASE_TAG: ${{ inputs.release_tag || needs.release_please.outputs.tag_name || github.ref_name }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: windows-latest
            rid: win-x64
            archive: exe
          - os: ubuntu-24.04
            rid: linux-x64
            archive: tar.gz
          - os: ubuntu-24.04
            rid: linux-arm64
            archive: tar.gz
          - os: macos-latest
            rid: osx-arm64
            archive: tar.gz
          - os: macos-latest
            rid: osx-x64
            archive: tar.gz
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v7
        with:
          ref: ${{ inputs.release_tag || needs.release_please.outputs.tag_name || github.ref }}
      - uses: actions/setup-dotnet@v6
        with:
          dotnet-version: 10.0.x
      - name: Publish self-contained single-file app
        run: dotnet publish src/ChromiumBuildUpdater/ChromiumBuildUpdater.csproj --configuration Release --runtime ${{ matrix.rid }} --self-contained true -p:PublishSingleFile=true -p:IncludeNativeLibrariesForSelfExtract=true --output publish
      - name: Package Windows executable
        if: matrix.rid == 'win-x64'
        shell: pwsh
        run: Copy-Item publish\ChromiumBuildUpdater.exe ChromiumBuildUpdater-${{ env.RELEASE_TAG }}-${{ matrix.rid }}.exe
      - name: Package Unix executable
        if: matrix.rid != 'win-x64'
        run: tar -czf ChromiumBuildUpdater-${{ env.RELEASE_TAG }}-${{ matrix.rid }}.tar.gz -C publish ChromiumBuildUpdater
      - uses: actions/upload-artifact@v7
        with:
          name: release-${{ matrix.rid }}
          path: ChromiumBuildUpdater-${{ env.RELEASE_TAG }}-${{ matrix.rid }}.${{ matrix.archive }}
          if-no-files-found: error

  release:
    name: Create GitHub release
    if: >-
      always() &&
      needs.publish.result == 'success'
    needs:
      - publish
      - release_please
    runs-on: ubuntu-24.04
    permissions:
      contents: write
    env:
      RELEASE_TAG: ${{ inputs.release_tag || needs.release_please.outputs.tag_name || github.ref_name }}
    steps:
      - uses: actions/download-artifact@v8
        with:
          pattern: release-*
          path: release-assets
          merge-multiple: true
      - name: Create SHA-256 manifest
        run: cd release-assets && sha256sum * > SHA256SUMS.txt
      - uses: softprops/action-gh-release@v3
        with:
          tag_name: ${{ env.RELEASE_TAG }}
          name: Chromium Build Updater ${{ env.RELEASE_TAG }}
          generate_release_notes: true
          files: release-assets/*
